apply plugin: 'com.android.library'

android {
    namespace 'com.miao1suki.shapeofcolor.privacy'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        minSdk 25
        consumerProguardFiles 'consumer-rules.pro'
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }
}
